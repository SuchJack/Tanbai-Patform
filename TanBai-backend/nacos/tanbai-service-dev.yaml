# ==================== Sa-Token 配置 (文档: https://sa-token.cc) ====================
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: tanbai
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # Cookie配置
  cookie:
    # 是否开启Cookie模式
    is-enabled: true
    # 设置SameSite属性
    same-site: None
    # 当SameSite=None时，必须设置Secure=true
    secure: true

# ==================== 腾讯云COS对象存储 ====================
cos:
  client:
    accessKey: xxxxxx
    secretKey: xxxxxx
    region: xxxxxx
    bucket: xxxxxx
# ==================== 自定义项目配置（对应SpringBoot的application.yaml配置） ====================
tan:
  datasource: # MySQL 数据库
    host: xxxxxx
    port: xxxxxx
    database: xxxxxx
    username: xxxxxx
    password: xxxxxx
    driver-class-name: com.mysql.cj.jdbc.Driver
  wechat: # 微信小程序配置
    appid: xxxxxx
    secret: xxxxxx
    # 小程序版本。正式版："release"体验版："trial"开发版："develop"
    env-version: release

# ==================== 日志配置 ====================
logging:
  level:
    com.truthgame: info
  file:
    name: logs/truth-game.log

# ==================== 微信支付配置 ====================
wx: # Nacos动态刷新，但Springboot动态刷新时没刷新WxPayService缓存，因此需要重启才能加载新配置！（待优化）
  pay:
    appId: xxxxxx
    mchId: xxxxxx
    apiV3Key: xxxxxx # APIv3密钥
    certSerialNo: xxxxxx # 商户API证书序列号
    # privateCertPath: E://mshkj//apiclient_cert.pem # 商户API证书（公钥验签不能配置！4.7.4.b版本SDK会触发autoUpdateCert()导致报错！）
    privateKeyPath: E://mshkj//apiclient_key.pem # 商户API证书私钥
    publicKeyId: xxxxxx # 微信公钥ID
    publicKeyPath: E://mshkj//pub_key.pem # # 微信公钥文件路径
    notifyUrl: https://xxxxxx./notify/paySuccess # 支付成功的回调地址