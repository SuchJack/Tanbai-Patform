# ==================== Spring基础配置 ====================
server:
  port: 8641 # 配置端口
spring:
  datasource:
    url: jdbc:mysql://${tan.datasource.host}:${tan.datasource.port}/${tan.datasource.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${tan.datasource.username}
    password: ${tan.datasource.password}
    driver-class-name: ${tan.datasource.driver-class-name}
  profiles:
    active: prod # 配置环境
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ==================== MyBatis Plus 配置 ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
#     log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  mapper-locations: classpath:mapper/*.xml

# ==================== 日志配置 ====================
logging:
  level:
    com.truthgame: debug
    org.springframework.web: info
    com.github.binarywang.demo.wx.pay: debug
    com.github.binarywang.wxpay: debug
  file:
    name: logs/truth-game.log

# ==================== knife4j配置 ====================
knife4j:
#  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表

# ==================== 微信小程序 ====================
wx:
  app-id: ${tan.wechat.appid}  # 优先使用环境变量
  app-secret: ${tan.wechat.secret}  # 优先使用环境变量
  env-version: ${tan.wechat.env-version}